<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Login | SSC Examination System</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#123b72,#2453d4);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:440px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    background:#123b72;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#172033;
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.admin-badge{
    background:#eff6ff;
    color:#123b72;
    padding:12px;
    border-radius:9px;
    text-align:center;
    margin-bottom:22px;
    font-weight:bold;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#374151;
    font-weight:600;
}

input{
    width:100%;
    height:52px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    background:#f8fafc;
}

input:focus{
    border-color:#2453d4;
    box-shadow:0 0 0 3px rgba(36,83,212,.12);
    background:white;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:70px;
}

.show-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#2453d4;
    font-weight:bold;
    cursor:pointer;
}

.login-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:9px;
    background:#123b72;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:9px;
    text-align:center;
    line-height:1.5;
    white-space:pre-wrap;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#2453d4;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        ADM
    </div>

    <h1>
        Admin Login
    </h1>

    <p class="subtitle">
        SSC Examination System
    </p>

    <div class="admin-badge">
        🔐 Authorized Administrator Access
    </div>

    <form id="adminLoginForm">

        <div class="form-group">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    id="showPassword"
                >
                    Show
                </button>

            </div>

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Admin Login
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="login.html"
        class="back"
    >
        ← Candidate Login
    </a>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG
   EXACT CONFIG FROM FIREBASE CONSOLE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCuYIuB_I9OrrTx6Qox6GnUerkN_vDgIHI",

    authDomain:
        "ssc-exam-project-8af6b.firebaseapp.com",

    projectId:
        "ssc-exam-project-8af6b",

    storageBucket:
        "ssc-exam-project-8af6b.firebasestorage.app",

    messagingSenderId:
        "288245274853",

    appId:
        "1:288245274853:web:b4d535a08faf305f5e9c0c",

    measurementId:
        "G-4BTLY67VDS"
};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

try{

    if(!firebase.apps.length){

        firebase.initializeApp(
            firebaseConfig
        );

    }

    console.log(
        "Firebase initialized successfully."
    );

}catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

}


/* =====================================================
   FIREBASE AUTH
===================================================== */

const auth =
    firebase.auth();


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById(
        "adminLoginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const showPassword =
    document.getElementById(
        "showPassword"
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Hide";

        }else{

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(
            !email ||
            !password
        ){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;

        }

        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";

        showMessage(
            "Connecting to Firebase...",
            "info"
        );


        try{

            /* =========================================
               LOCAL PERSISTENCE
            ========================================= */

            await auth.setPersistence(
                firebase.auth.Auth.Persistence.LOCAL
            );


            /* =========================================
               SIGN IN
            ========================================= */

            const result =
                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );


            const user =
                result.user;


            if(!user){

                throw new Error(
                    "Firebase user session was not created."
                );

            }


            /* =========================================
               REFRESH TOKEN
            ========================================= */

            await user.getIdToken(
                true
            );


            /* =========================================
               SAVE ADMIN SESSION
            ========================================= */

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );

            sessionStorage.setItem(
                "adminUID",
                user.uid
            );

            sessionStorage.setItem(
                "adminEmail",
                user.email || ""
            );


            console.log(
                "================================"
            );

            console.log(
                "ADMIN LOGIN SUCCESS"
            );

            console.log(
                "UID:",
                user.uid
            );

            console.log(
                "EMAIL:",
                user.email
            );

            console.log(
                "Firebase Auth currentUser:",
                auth.currentUser
            );

            console.log(
                "================================"
            );


            showMessage(
                "✅ Admin login successful.\n\nOpening Admin Dashboard...",
                "success"
            );


            /* =========================================
               REDIRECT
            ========================================= */

            setTimeout(
                function(){

                    window.location.replace(
                        "admin_dashboard.html"
                    );

                },
                800
            );


        }catch(error){

            console.error(
                "================================"
            );

            console.error(
                "ADMIN LOGIN ERROR"
            );

            console.error(
                error
            );

            console.error(
                "CODE:",
                error.code
            );

            console.error(
                "MESSAGE:",
                error.message
            );

            console.error(
                "================================"
            );


            let errorMessage =
                "Admin login failed.";


            switch(error.code){

                case "auth/api-key-not-valid":

                    errorMessage =
                        "Firebase API key is being rejected.\n\n" +
                        "Please verify the Web App API key in Firebase Console.";

                    break;


                case "auth/invalid-credential":

                    errorMessage =
                        "Invalid email or password.";

                    break;


                case "auth/user-not-found":

                    errorMessage =
                        "Admin account not found in Firebase Authentication.";

                    break;


                case "auth/wrong-password":

                    errorMessage =
                        "Incorrect password.";

                    break;


                case "auth/invalid-email":

                    errorMessage =
                        "Invalid email address.";

                    break;


                case "auth/user-disabled":

                    errorMessage =
                        "This admin account has been disabled.";

                    break;


                case "auth/too-many-requests":

                    errorMessage =
                        "Too many login attempts. Please try again later.";

                    break;


                case "auth/network-request-failed":

                    errorMessage =
                        "Network error. Check your internet connection.";

                    break;


                case "auth/operation-not-allowed":

                    errorMessage =
                        "Email/Password authentication is disabled in Firebase.";

                    break;


                default:

                    errorMessage =
                        error.message ||
                        errorMessage;

            }


            showMessage(
                "❌ " +
                errorMessage,
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Admin Login";

        }

    }
);


/* =====================================================
   AUTH STATE MONITOR
===================================================== */

auth.onAuthStateChanged(
    function(user){

        if(user){

            console.log(
                "Firebase Auth State: LOGGED IN"
            );

            console.log(
                "User:",
                user.email
            );

        }else{

            console.log(
                "Firebase Auth State: LOGGED OUT"
            );

        }

    }
);

</script>

</body>
</html>
