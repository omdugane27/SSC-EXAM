<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login | SSC Examination System</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            #0f3b82,
            #2563eb,
            #1d4ed8
        );

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:#172033;
}


/* ================= CARD ================= */

.login-card{
    width:100%;
    max-width:500px;

    background:white;

    border-radius:24px;

    padding:42px 40px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.22);
}


/* ================= LOGO ================= */

.logo{
    width:115px;
    height:115px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #173f7a,
            #2563eb
        );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:0 auto 24px;

    font-size:32px;
    font-weight:bold;

    box-shadow:
        0 8px 25px rgba(37,99,235,.25);
}


/* ================= TITLE ================= */

h1{
    text-align:center;

    font-size:31px;

    margin-bottom:7px;
}

.subtitle{
    text-align:center;

    color:#64748b;

    font-size:17px;

    margin-bottom:25px;
}


/* ================= SECURITY ================= */

.security{
    background:#eff6ff;

    color:#1e467e;

    border-radius:12px;

    padding:14px;

    text-align:center;

    font-size:15px;

    font-weight:bold;

    margin-bottom:27px;
}


/* ================= FORM ================= */

.form-group{
    margin-bottom:20px;
}

label{
    display:block;

    font-size:16px;

    font-weight:bold;

    margin-bottom:8px;

    color:#334155;
}

input{
    width:100%;

    height:56px;

    border:2px solid #d7dce5;

    border-radius:11px;

    padding:0 15px;

    font-size:16px;

    outline:none;

    background:#f8fafc;

    transition:.2s;
}

input:focus{
    border-color:#2563eb;

    background:white;

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
}


/* ================= PASSWORD ================= */

.password-box{
    position:relative;
}

.password-box input{
    padding-right:70px;
}

.show-password{
    position:absolute;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#2563eb;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;
}


/* ================= BUTTON ================= */

.login-btn{
    width:100%;

    height:57px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #1d4ed8,
            #2563eb
        );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

    transition:.2s;
}

.login-btn:hover{
    box-shadow:
        0 8px 20px rgba(37,99,235,.25);
}

.login-btn:disabled{
    background:#9ca3af;

    cursor:not-allowed;

    box-shadow:none;
}


/* ================= MESSAGE ================= */

.message{
    display:none;

    margin-top:18px;

    padding:15px;

    border-radius:11px;

    text-align:center;

    font-size:14px;

    line-height:1.5;

    white-space:pre-line;
}

.message.show{
    display:block;
}

.message.success{
    background:#dcfce7;

    color:#166534;
}

.message.error{
    background:#fee2e2;

    color:#991b1b;
}

.message.info{
    background:#dbeafe;

    color:#1e40af;
}


/* ================= BACK ================= */

.back-link{
    display:block;

    text-align:center;

    margin-top:24px;

    color:#2563eb;

    text-decoration:none;

    font-size:15px;

    font-weight:bold;
}

.back-link:hover{
    text-decoration:underline;
}


/* ================= FOOTER ================= */

.footer{
    text-align:center;

    color:#94a3b8;

    font-size:11px;

    margin-top:23px;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    body{
        padding:14px;
    }

    .login-card{
        padding:32px 22px;

        border-radius:20px;
    }

    .logo{
        width:100px;
        height:100px;

        font-size:28px;
    }

    h1{
        font-size:28px;
    }

    .subtitle{
        font-size:16px;
    }

    .security{
        font-size:13px;
    }

    input{
        height:54px;
    }

    .login-btn{
        height:54px;

        font-size:16px;
    }
}

</style>

</head>


<body>


<div class="login-card">


    <!-- LOGO -->

    <div class="logo">
        ADM
    </div>


    <!-- TITLE -->

    <h1>
        Admin Login
    </h1>


    <div class="subtitle">
        SSC Examination System
    </div>


    <!-- SECURITY -->

    <div class="security">
        🔐 Authorized Administrator Access
    </div>


    <!-- FORM -->

    <form id="loginForm">


        <div class="form-group">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>


            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                    id="showPassword"
                >
                    Show
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login to Admin Dashboard
        </button>


    </form>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- CANDIDATE -->

    <a
        href="login.html"
        class="back-link"
    >
        ← Candidate Login
    </a>


    <div class="footer">
        SSC Examination System • Administrator Panel
    </div>


</div>



<!-- =====================================================
FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>


<script>


/* =====================================================
FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCuYIuB_I9OrrTx6Qox6GnUerkN_vDgIHI",

    authDomain:
        "ssc-exam-project-8af6b.firebaseapp.com",

    projectId:
        "ssc-exam-project-8af6b",

    storageBucket:
        "ssc-exam-project-8af6b.firebasestorage.app",

    messagingSenderId:
        "288245274853",

    appId:
        "1:288245274853:web:b4d535a08faf305f5e9c0c",

    measurementId:
        "G-4BTLY67VDS"

};


/* =====================================================
INITIALIZE FIREBASE
===================================================== */

if(
    !firebase.apps.length
){

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();


/* =====================================================
DOM
===================================================== */

const form =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const message =
    document.getElementById(
        "message"
    );


/* =====================================================
MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}


function hideMessage(){

    message.textContent =
        "";

    message.className =
        "message";

}


/* =====================================================
SHOW / HIDE PASSWORD
===================================================== */

function togglePassword(){

    const button =
        document.getElementById(
            "showPassword"
        );


    if(
        passwordInput.type ===
        "password"
    ){

        passwordInput.type =
            "text";

        button.textContent =
            "Hide";

    }
    else{

        passwordInput.type =
            "password";

        button.textContent =
            "Show";

    }

}


/* =====================================================
LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessage();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "Please enter admin email.",
                "error"
            );

            return;

        }


        if(!password){

            showMessage(
                "Please enter admin password.",
                "error"
            );

            return;

        }


        /* LOCK BUTTON */

        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        showMessage(
            "Connecting to Firebase...",
            "info"
        );


        try{


            /* =========================================
            FIREBASE AUTH LOGIN
            ========================================= */

            const result =
                await auth
                .signInWithEmailAndPassword(
                    email,
                    password
                );


            const user =
                result.user;


            if(!user){

                throw new Error(
                    "Firebase authentication failed."
                );

            }


            console.log(
                "Admin login successful:",
                user.uid
            );


            /* =========================================
            SAVE ADMIN SESSION
            ========================================= */

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            sessionStorage.setItem(
                "adminUID",
                user.uid
            );


            sessionStorage.setItem(
                "adminEmail",
                user.email || email
            );


            sessionStorage.setItem(
                "adminLoginTime",
                new Date().toISOString()
            );


            /* =========================================
            SUCCESS
            ========================================= */

            showMessage(
                "✅ Admin login successful.\nOpening Admin Dashboard...",
                "success"
            );


            /*
               IMPORTANT:
               Your actual filename is:
               admin_dashboard.html

               Direct redirect.
               No fetch.
               No HEAD.
               No fallback.
            */

            setTimeout(
                function(){

                    window.location.href =
                        "admin_dashboard.html";

                },
                500
            );


        }
        catch(error){

            console.error(
                "Admin Login Error:",
                error
            );


            /* CLEAR SESSION */

            sessionStorage.removeItem(
                "adminLoggedIn"
            );

            sessionStorage.removeItem(
                "adminUID"
            );

            sessionStorage.removeItem(
                "adminEmail"
            );


            let errorMessage =
                "Unable to login.";


            switch(
                error.code
            ){

                case "auth/invalid-email":

                    errorMessage =
                        "Invalid email address.";

                    break;


                case "auth/user-not-found":

                    errorMessage =
                        "Admin account not found.";

                    break;


                case "auth/wrong-password":

                    errorMessage =
                        "Incorrect password.";

                    break;


                case "auth/invalid-credential":

                    errorMessage =
                        "Incorrect email or password.";

                    break;


                case "auth/user-disabled":

                    errorMessage =
                        "This admin account is disabled.";

                    break;


                case "auth/too-many-requests":

                    errorMessage =
                        "Too many login attempts. Try again later.";

                    break;


                case "auth/network-request-failed":

                    errorMessage =
                        "Network error. Check your internet connection.";

                    break;


                case "auth/operation-not-allowed":

                    errorMessage =
                        "Email/Password login is disabled in Firebase.";

                    break;


                default:

                    errorMessage =
                        error.message ||
                        "Login failed.";

            }


            showMessage(
                "❌ " + errorMessage,
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login to Admin Dashboard";

        }

    }
);

</script>


</body>

</html>
