<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candidate Login | SSC Examination System</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:#f1f5fb;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:460px;
    background:#fff;
    padding:32px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
    width:78px;
    height:78px;
    background:#2453d4;
    color:#fff;
    border-radius:50%;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#172033;
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#77808f;
    font-size:15px;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    color:#374151;
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
}

input{
    width:100%;
    height:52px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    background:#f8fafc;
}

input:focus{
    border-color:#2453d4;
    box-shadow:0 0 0 2px rgba(36,83,212,.12);
    background:#fff;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:70px;
}

.show-btn{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#2453d4;
    font-size:14px;
    cursor:pointer;
    font-weight:600;
}

.forgot{
    display:block;
    text-align:right;
    margin-top:10px;
    color:#2453d4;
    text-decoration:none;
    font-size:15px;
}

.login-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:9px;
    background:#2453d4;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.login-btn:disabled{
    background:#9aa9d8;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:16px;
    padding:13px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
    line-height:1.4;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.register-text{
    text-align:center;
    margin-top:28px;
    color:#6b7280;
    font-size:15px;
}

.register-text a{
    color:#2453d4;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">SSC</div>

    <h1>Candidate Login</h1>

    <p class="subtitle">
        SSC Examination Centre Management System
    </p>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    id="showPassword"
                >
                    Show
                </button>

            </div>

            <a
                href="#"
                class="forgot"
                id="forgotPassword"
            >
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login
        </button>

    </form>


    <div id="message" class="message"></div>


    <div class="register-text">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG — EXACT CONFIG PROVIDED BY YOU
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCuYIuB_I9OrrTx6Qox6GnUerkN_vDgIHI",
    authDomain: "ssc-exam-project-8af6b.firebaseapp.com",
    projectId: "ssc-exam-project-8af6b",
    storageBucket: "ssc-exam-project-8af6b.firebasestorage.app",
    messagingSenderId: "288245274853",
    appId: "1:288245274853:web:b4d535a08faf305f5e9c0c",
    measurementId: "G-4BTLY67VDS"
};


/* =====================================================
   FIREBASE INITIALIZATION
===================================================== */

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");

const forgotPassword =
    document.getElementById("forgotPassword");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;
}


function hideMessage() {

    message.textContent = "";

    message.className = "message";
}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showPassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            showPassword.textContent = "Hide";

        } else {

            passwordInput.type = "password";

            showPassword.textContent = "Show";

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try {

            /*
             Keep Firebase authentication
             session after page change.
            */

            await auth.setPersistence(
                firebase.auth.Auth.Persistence.LOCAL
            );


            /*
             Firebase Email/Password login.
            */

            const credential =
                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "LOGIN SUCCESS",
                user.uid,
                user.email
            );


            /*
             Save candidate information
             for dashboard.
            */

            sessionStorage.setItem(
                "candidateUID",
                user.uid
            );

            sessionStorage.setItem(
                "candidateEmail",
                user.email || email
            );


            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            /*
             Redirect only after successful login.
            */

            setTimeout(
                function () {

                    window.location.replace(
                        "candidate_dashboard.html"
                    );

                },
                700
            );


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            let errorMessage =
                "Login failed. Please try again.";


            switch (error.code) {

                case "auth/invalid-email":

                    errorMessage =
                        "Invalid email address.";

                    break;


                case "auth/user-not-found":

                    errorMessage =
                        "Candidate account not found.";

                    break;


                case "auth/wrong-password":

                    errorMessage =
                        "Incorrect password.";

                    break;


                case "auth/invalid-credential":

                    errorMessage =
                        "Invalid email or password.";

                    break;


                case "auth/user-disabled":

                    errorMessage =
                        "This candidate account is disabled.";

                    break;


                case "auth/too-many-requests":

                    errorMessage =
                        "Too many login attempts. Try again later.";

                    break;


                case "auth/network-request-failed":

                    errorMessage =
                        "Network error. Check your internet connection.";

                    break;


                case "auth/operation-not-allowed":

                    errorMessage =
                        "Email/Password authentication is disabled.";

                    break;


                case "auth/api-key-not-valid":

                    errorMessage =
                        "Firebase API key is not valid.";

                    break;


                default:

                    errorMessage =
                        error.message ||
                        errorMessage;

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login";

        }

    }
);


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotPassword.addEventListener(
    "click",
    async function (event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value.trim();


        if (!email) {

            showMessage(
                "Enter your email address first.",
                "error"
            );

            emailInput.focus();

            return;
        }


        try {

            await auth.sendPasswordResetEmail(
                email
            );


            showMessage(
                "Password reset email sent successfully.",
                "success"
            );


        } catch (error) {

            console.error(
                "PASSWORD RESET ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Unable to send reset email.",
                "error"
            );

        }

    }
);


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(
    function (user) {

        if (user) {

            console.log(
                "Firebase Auth User:",
                user.uid,
                user.email
            );

        } else {

            console.log(
                "Firebase Auth: No user"
            );

        }

    }
);

</script>

</body>
</html>
