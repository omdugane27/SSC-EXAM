<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invigilator Management | SSC Examination System</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 22px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-email {
      font-size: 13px;
      opacity: .85;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .container {
      max-width: 1250px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      font-size: 24px;
    }

    .back-btn {
      background: #374151;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .stat-card span {
      display: block;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 28px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .panel h3 {
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .full {
      grid-column: 1 / -1;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
      margin-bottom: 18px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f9fafb;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .active {
      background: #dcfce7;
      color: #166534;
    }

    .inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .activate {
      background: #16a34a;
      color: white;
    }

    .deactivate {
      background: #f59e0b;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    @media (max-width: 750px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SSC Examination System</h1>

  <div class="header-right">
    <span class="admin-email" id="adminEmail">Admin</span>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

  <div class="topbar">
    <h2>Invigilator Management</h2>
    <button class="back-btn" onclick="location.href='admin_dashboard.html'">
      ← Dashboard
    </button>
  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="stat-card">
      <span>Total Invigilators</span>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat-card">
      <span>Active</span>
      <strong id="activeCount">0</strong>
    </div>

    <div class="stat-card">
      <span>Inactive</span>
      <strong id="inactiveCount">0</strong>
    </div>

  </div>

  <!-- CREATE -->
  <div class="panel">

    <h3>Create Invigilator</h3>

    <form id="invigilatorForm">

      <div class="form-grid">

        <div>
          <label>Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter full name"
            required
          >
        </div>

        <div>
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter email address"
            required
          >
        </div>

        <div>
          <label>Employee ID</label>
          <input
            type="text"
            id="employeeId"
            placeholder="Example: INV-101"
            required
          >
        </div>

        <div>
          <label>Centre</label>
          <select id="centre" required>
            <option value="">Select Centre</option>
            <option value="Centre-01">Centre-01</option>
            <option value="Centre-02">Centre-02</option>
            <option value="Centre-03">Centre-03</option>
          </select>
        </div>

        <div>
          <label>Lab / Room</label>
          <select id="lab" required>
            <option value="">Select Lab</option>
            <option value="Lab-01">Lab-01</option>
            <option value="Lab-02">Lab-02</option>
            <option value="Lab-03">Lab-03</option>
            <option value="Lab-04">Lab-04</option>
            <option value="Lab-05">Lab-05</option>
          </select>
        </div>

        <div>
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
          >
        </div>

        <div class="full">
          <button
            type="submit"
            class="primary"
            id="createBtn"
          >
            Create Invigilator
          </button>
        </div>

      </div>

      <div id="formMessage" class="message"></div>

    </form>

  </div>

  <!-- LIST -->
  <div class="panel">

    <h3>Invigilators</h3>

    <div class="filters">

      <input
        type="search"
        id="searchInput"
        placeholder="Search name, email, employee ID, centre, lab or UID..."
      >

      <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>

    </div>

    <div id="loading" class="loading">
      Loading invigilators...
    </div>

    <div class="table-wrapper">

      <table id="invigilatorTable" style="display:none;">

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Employee ID</th>
            <th>Centre</th>
            <th>Lab / Room</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="invigilatorBody"></tbody>

      </table>

    </div>

    <div id="emptyState" class="empty" style="display:none;">
      No invigilators found.
    </div>

  </div>

</div>

<script>

  // ==============================
  // FIREBASE CONFIG
  // ==============================

  const firebaseConfig = {
    apiKey: "AIzaSyCuYIuB_I9OrrTx6Qox6GnUerkN_vDgIHI",
    authDomain: "ssc-exam-project-8af6b.firebaseapp.com",
    projectId: "ssc-exam-project-8af6b",
    storageBucket: "ssc-exam-project-8af6b.firebasestorage.app",
    messagingSenderId: "288245274853",
    appId: "1:288245274853:web:b4d535a08faf305f5e9c0c",
    measurementId: "G-4BTLY67VDS"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  // ==============================
  // SUPABASE EDGE FUNCTION
  // ==============================

  const FUNCTION_URL =
    "https://sjvdfvibbdxjtmfmuyci.supabase.co/functions/v1/hyper-function";

  // ==============================
  // GLOBAL DATA
  // ==============================

  let currentAdmin = null;
  let allInvigilators = [];

  // ==============================
  // AUTH GUARD
  // ==============================

  auth.onAuthStateChanged(async (user) => {

    if (!user) {
      location.href = "admin_login.html";
      return;
    }

    const sessionUID = sessionStorage.getItem("adminUID");

    if (
      sessionStorage.getItem("adminLoggedIn") !== "true" ||
      !sessionUID ||
      sessionUID !== user.uid
    ) {
      await auth.signOut();
      location.href = "admin_login.html";
      return;
    }

    currentAdmin = user;

    document.getElementById("adminEmail").textContent =
      user.email || "Admin";

    loadInvigilators();

  });

  // ==============================
  // LOAD INVIGILATORS
  // ==============================

  async function loadInvigilators() {

    const loading = document.getElementById("loading");

    loading.style.display = "block";

    try {

      const snapshot =
        await db.collection("invigilators").get();

      allInvigilators = [];

      snapshot.forEach(doc => {

        const data = doc.data();

        allInvigilators.push({
          id: doc.id,
          ...data
        });

      });

      updateStats();
      renderInvigilators();

    } catch (error) {

      console.error(error);

      loading.textContent =
        "Failed to load invigilators: " + error.message;

    }

  }

  // ==============================
  // STATS
  // ==============================

  function updateStats() {

    const total = allInvigilators.length;

    const active =
      allInvigilators.filter(
        x => String(x.status || "").toLowerCase() === "active"
      ).length;

    const inactive = total - active;

    document.getElementById("totalCount").textContent = total;
    document.getElementById("activeCount").textContent = active;
    document.getElementById("inactiveCount").textContent = inactive;

  }

  // ==============================
  // SEARCH + STATUS FILTER
  // ==============================

  document
    .getElementById("searchInput")
    .addEventListener("input", renderInvigilators);

  document
    .getElementById("statusFilter")
    .addEventListener("change", renderInvigilators);

  function renderInvigilators() {

    const search =
      document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const status =
      document.getElementById("statusFilter").value;

    const filtered = allInvigilators.filter(item => {

      const searchable = [
        item.name,
        item.fullName,
        item.email,
        item.employeeId,
        item.centre,
        item.lab,
        item.roomNo,
        item.uid,
        item.id
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      const matchesSearch =
        !search || searchable.includes(search);

      const itemStatus =
        String(item.status || "active").toLowerCase();

      const matchesStatus =
        status === "all" ||
        itemStatus === status;

      return matchesSearch && matchesStatus;

    });

    const body =
      document.getElementById("invigilatorBody");

    const table =
      document.getElementById("invigilatorTable");

    const empty =
      document.getElementById("emptyState");

    const loading =
      document.getElementById("loading");

    loading.style.display = "none";

    body.innerHTML = "";

    if (filtered.length === 0) {

      table.style.display = "none";
      empty.style.display = "block";

      return;
    }

    table.style.display = "table";
    empty.style.display = "none";

    filtered.forEach(item => {

      const status =
        String(item.status || "active").toLowerCase();

      const tr = document.createElement("tr");

      tr.innerHTML = `

        <td>
          <strong>
            ${escapeHTML(item.name || item.fullName || "-")}
          </strong>
        </td>

        <td>
          ${escapeHTML(item.email || "-")}
        </td>

        <td>
          ${escapeHTML(item.employeeId || "-")}
        </td>

        <td>
          ${escapeHTML(item.centre || "-")}
        </td>

        <td>
          ${escapeHTML(item.lab || item.roomNo || "-")}
        </td>

        <td>
          <span class="badge ${status === "active" ? "active" : "inactive"}">
            ${status === "active" ? "ACTIVE" : "INACTIVE"}
          </span>
        </td>

        <td>

          <div class="actions">

            ${
              status === "active"

              ? `
                <button
                  class="deactivate"
                  onclick="changeStatus(
                    '${escapeJS(item.uid || item.id)}',
                    'deactivate'
                  )"
                >
                  Deactivate
                </button>
              `

              : `
                <button
                  class="activate"
                  onclick="changeStatus(
                    '${escapeJS(item.uid || item.id)}',
                    'activate'
                  )"
                >
                  Activate
                </button>
              `
            }

            <button
              class="delete"
              onclick="deleteInvigilator(
                '${escapeJS(item.uid || item.id)}',
                '${escapeJS(item.name || item.fullName || item.email || "this invigilator")}'
              )"
            >
              Delete
            </button>

          </div>

        </td>

      `;

      body.appendChild(tr);

    });

  }

  // ==============================
  // CREATE INVIGILATOR
  // ==============================

  document
    .getElementById("invigilatorForm")
    .addEventListener("submit", async (e) => {

      e.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim().toLowerCase();

      const employeeId =
        document
          .getElementById("employeeId")
          .value
          .trim()
          .toUpperCase();

      const centre =
        document.getElementById("centre").value;

      const lab =
        document.getElementById("lab").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("formMessage");

      const createBtn =
        document.getElementById("createBtn");

      message.className = "message";
      message.textContent = "";

      // ------------------------------
      // CLIENT-SIDE DUPLICATE CHECK
      // ------------------------------

      const emailExists =
        allInvigilators.some(
          x =>
            String(x.email || "")
              .toLowerCase()
              === email
        );

      if (emailExists) {

        showMessage(
          "This email is already registered as an invigilator.",
          "error"
        );

        return;
      }

      const employeeExists =
        allInvigilators.some(
          x =>
            String(x.employeeId || "")
              .toUpperCase()
              === employeeId
        );

      if (employeeExists) {

        showMessage(
          "This Employee ID is already registered.",
          "error"
        );

        return;
      }

      if (password.length < 6) {

        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );

        return;
      }

      createBtn.disabled = true;
      createBtn.textContent = "Creating...";

      try {

        const idToken =
          await currentAdmin.getIdToken(true);

        const response =
          await fetch(FUNCTION_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + idToken
            },

            body: JSON.stringify({

              action: "create_invigilator",

              name,
              email,
              employeeId,
              password,
              centre,
              lab,
              roomNo: lab

            })

          });

        const result =
          await response.json();

        if (!response.ok) {

          if (
            result.code === "EMAIL_ALREADY_EXISTS"
          ) {

            throw new Error(
              "This email is already registered."
            );

          }

          if (
            result.code === "EMPLOYEE_ID_ALREADY_EXISTS"
          ) {

            throw new Error(
              "This Employee ID is already registered."
            );

          }

          throw new Error(
            result.error ||
            result.message ||
            "Failed to create invigilator."
          );

        }

        showMessage(
          "Invigilator created successfully.",
          "success"
        );

        document
          .getElementById("invigilatorForm")
          .reset();

        await loadInvigilators();

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Something went wrong.",
          "error"
        );

      } finally {

        createBtn.disabled = false;
        createBtn.textContent = "Create Invigilator";

      }

    });

  // ==============================
  // ACTIVATE / DEACTIVATE
  // ==============================

  async function changeStatus(uid, action) {

    if (!uid) {

      alert("Invigilator UID not found.");
      return;

    }

    const confirmText =
      action === "activate"
        ? "Activate this invigilator?"
        : "Deactivate this invigilator?";

    if (!confirm(confirmText)) return;

    try {

      const idToken =
        await currentAdmin.getIdToken(true);

      const response =
        await fetch(FUNCTION_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + idToken
          },

          body: JSON.stringify({

            action:
              action === "activate"
                ? "activate_invigilator"
                : "deactivate_invigilator",

            uid

          })

        });

      const result =
        await response.json();

      if (!response.ok) {

        throw new Error(
          result.error ||
          result.message ||
          "Status update failed."
        );

      }

      alert(
        action === "activate"
          ? "Invigilator activated successfully."
          : "Invigilator deactivated successfully."
      );

      await loadInvigilators();

    } catch (error) {

      console.error(error);

      alert(
        "Error: " +
        (error.message || "Status update failed.")
      );

    }

  }

  // ==============================
  // SECURE DELETE
  // ==============================

  async function deleteInvigilator(uid, displayName) {

    if (!uid) {

      alert("Invigilator UID not found.");
      return;

    }

    const confirmed =
      confirm(
        "Delete invigilator:\n\n" +
        displayName +
        "\n\nThis will permanently delete the Firebase Auth account and Firestore record.\n\nContinue?"
      );

    if (!confirmed) return;

    const secondConfirm =
      confirm(
        "FINAL CONFIRMATION\n\n" +
        "Are you sure you want to permanently delete this invigilator?"
      );

    if (!secondConfirm) return;

    try {

      const idToken =
        await currentAdmin.getIdToken(true);

      const response =
        await fetch(FUNCTION_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + idToken
          },

          body: JSON.stringify({

            action: "delete_invigilator",

            uid

          })

        });

      const result =
        await response.json();

      if (!response.ok) {

        throw new Error(
          result.error ||
          result.message ||
          "Delete failed."
        );

      }

      alert(
        "Invigilator deleted successfully."
      );

      await loadInvigilators();

    } catch (error) {

      console.error(error);

      alert(
        "Delete failed:\n" +
        (error.message || "Unknown error")
      );

    }

  }

  // ==============================
  // MESSAGE
  // ==============================

  function showMessage(text, type) {

    const message =
      document.getElementById("formMessage");

    message.textContent = text;

    message.className =
      "message " + type;

  }

  // ==============================
  // HTML ESCAPE
  // ==============================

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  // ==============================
  // JS ESCAPE
  // ==============================

  function escapeJS(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r");

  }

  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    try {

      sessionStorage.removeItem("adminLoggedIn");
      sessionStorage.removeItem("adminUID");
      sessionStorage.removeItem("adminEmail");
      sessionStorage.removeItem("adminLoginTime");

      await auth.signOut();

    } catch (error) {

      console.error(error);

    }

    location.href = "admin_login.html";

  }

</script>

</body>
</html>
