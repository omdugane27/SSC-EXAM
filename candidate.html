<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Registration - SSC Exam</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #1e3a8a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .group {
            margin-bottom: 16px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 15px;
            background: #f8fafc;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            background: white;
        }

        .terms {
            display: flex;
            gap: 8px;
            margin: 18px 0;
            align-items: flex-start;
        }

        .terms input {
            width: 18px;
            height: 18px;
        }

        .terms label {
            font-weight: normal;
            font-size: 13px;
        }

        button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }

        .links p {
            margin: 8px;
            font-size: 14px;
            color: #64748b;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 18px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">SSC</div>

        <h1>Candidate Registration</h1>

        <p class="subtitle">
            Register for Computer Based Examination
        </p>

        <form id="registrationForm">

            <div class="group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter full name"
                    required>
            </div>

            <div class="row">

                <div class="group">
                    <label>Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        required>
                </div>

                <div class="group">
                    <label>Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        maxlength="10"
                        inputmode="numeric"
                        placeholder="10-digit mobile"
                        required>
                </div>

            </div>

            <div class="group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required>
            </div>

            <div class="row">

                <div class="group">
                    <label>Select Examination</label>

                    <select id="exam" required>
                        <option value="">Select Examination</option>
                        <option>SSC CGL</option>
                        <option>SSC CHSL</option>
                        <option>SSC MTS</option>
                        <option>SSC GD</option>
                        <option>SSC Stenographer</option>
                    </select>
                </div>

                <div class="group">
                    <label>Examination Centre</label>

                    <select id="centre" required>
                        <option value="">Select Centre</option>
                        <option>Mumbai</option>
                        <option>Pune</option>
                        <option>Nagpur</option>
                        <option>Nashik</option>
                        <option>Amravati</option>
                        <option>Chhatrapati Sambhajinagar</option>
                    </select>
                </div>

            </div>

            <div class="group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    minlength="6"
                    placeholder="Minimum 6 characters"
                    required>
            </div>

            <div class="group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    minlength="6"
                    placeholder="Confirm password"
                    required>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the examination terms and conditions.
                </label>
            </div>

            <button type="submit" id="registerButton">
                Register Candidate
            </button>

            <div id="message"></div>

        </form>

        <div class="links">

            <p>
                Already registered?
                <a href="login.html">Candidate Login</a>
            </p>

            <p>
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>

</div>

<script src="Js/candidate.js"></script>

</body>
</html>
