<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exam Access | SSC Examination System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:#ffffff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.30);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#1e3a8a;
    font-size:25px;
    margin-bottom:8px;
}

.header p{
    color:#64748b;
    font-size:14px;
}

.info{
    background:#f8fafc;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid #e2e8f0;
}

.row:last-child{
    border-bottom:none;
}

.label{
    color:#64748b;
    font-size:14px;
}

.value{
    color:#0f172a;
    font-weight:bold;
    text-align:right;
    font-size:14px;
}

.pin-title{
    font-weight:bold;
    color:#0f172a;
    margin-bottom:8px;
}

#examPin{
    width:100%;
    padding:15px;
    border:2px solid #cbd5e1;
    border-radius:12px;
    font-size:22px;
    text-align:center;
    letter-spacing:6px;
    outline:none;
}

#examPin:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#94a3b8;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    display:none;
    font-size:14px;
}

.error{
    display:block;
    background:#fee2e2;
    color:#b91c1c;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.loading{
    text-align:center;
    color:#64748b;
    margin:15px 0;
}
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <h1>SSC Examination System</h1>
        <p>Secure Examination Access</p>
    </div>

    <div id="loading" class="loading">
        Loading candidate information...
    </div>

    <div id="candidateInfo" style="display:none;">

        <div class="info">

            <div class="row">
                <span class="label">Candidate</span>
                <span class="value" id="candidateName">-</span>
            </div>

            <div class="row">
                <span class="label">Roll Number</span>
                <span class="value" id="rollNumber">-</span>
            </div>

            <div class="row">
                <span class="label">Examination</span>
                <span class="value" id="examName">-</span>
            </div>

            <div class="row">
                <span class="label">Centre</span>
                <span class="value" id="centre">-</span>
            </div>

            <div class="row">
                <span class="label">Room / Lab</span>
                <span class="value" id="roomNo">-</span>
            </div>

            <div class="row">
                <span class="label">Seat Number</span>
                <span class="value" id="seatNumber">-</span>
            </div>

        </div>

        <div class="pin-title">
            Enter Examination PIN
        </div>

        <input
            type="text"
            id="examPin"
            maxlength="6"
            inputmode="numeric"
            autocomplete="off"
            placeholder="••••••"
        >

        <button id="verifyButton">
            Verify PIN & Continue
        </button>

        <div id="message" class="message"></div>

    </div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {
    apiKey: "AIzaSyCuYIuB_I9OrrTx6Qox6GnUerkN_vDgIHI",
    authDomain: "ssc-exam-project-8af6b.firebaseapp.com",
    projectId: "ssc-exam-project-8af6b",
    storageBucket: "ssc-exam-project-8af6b.firebasestorage.app",
    messagingSenderId: "288245274853",
    appId: "1:288245274853:web:b4d535a08faf305f5e9c0c",
    measurementId: "G-4BTLY67VDS"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let candidateData = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, type){

    const message = document.getElementById("message");

    message.textContent = text;

    message.className = "message " + type;

}


/* =========================
   LOAD CANDIDATE
========================= */

auth.onAuthStateChanged(async function(user){

    if(!user){

        showMessage(
            "Please login first.",
            "error"
        );

        document.getElementById("loading").style.display = "none";

        setTimeout(function(){

            window.location.replace("login.html");

        },1500);

        return;
    }

    currentUser = user;

    try{

        const doc = await db
            .collection("candidates")
            .doc(user.uid)
            .get();

        if(!doc.exists){

            document.getElementById("loading").style.display = "none";

            showMessage(
                "Candidate record not found.",
                "error"
            );

            return;
        }

        candidateData = doc.data();

        document.getElementById("loading").style.display = "none";

        document.getElementById("candidateInfo").style.display = "block";


        /* Candidate */

        document.getElementById("candidateName").textContent =
            candidateData.fullName ||
            candidateData.name ||
            user.displayName ||
            "Candidate";


        /* Roll */

        document.getElementById("rollNumber").textContent =
            candidateData.rollNumber ||
            "-";


        /* Exam */

        document.getElementById("examName").textContent =
            candidateData.assignedExamName ||
            candidateData.examName ||
            "Assigned Examination";


        /* Centre */

        document.getElementById("centre").textContent =
            candidateData.centre ||
            candidateData.center ||
            candidateData.centreName ||
            "-";


        /* Room */

        document.getElementById("roomNo").textContent =
            candidateData.roomNo ||
            candidateData.lab ||
            candidateData.room ||
            candidateData.roomName ||
            "-";


        /* Seat */

        document.getElementById("seatNumber").textContent =
            candidateData.seatNumber ||
            "-";


    }catch(error){

        console.error(error);

        document.getElementById("loading").style.display = "none";

        showMessage(
            "Error loading candidate information: " +
            error.message,
            "error"
        );

    }

});


/* =========================
   VERIFY PIN
========================= */

document
.getElementById("verifyButton")
.addEventListener("click", async function(){

    const button = document.getElementById("verifyButton");

    const enteredPin =
        document
        .getElementById("examPin")
        .value
        .trim();

    /* Candidate not loaded */

    if(!currentUser || !candidateData){

        showMessage(
            "Candidate information is still loading. Please wait.",
            "error"
        );

        return;
    }


    /* Empty PIN */

    if(!enteredPin){

        showMessage(
            "Please enter the 6-digit examination PIN.",
            "error"
        );

        return;
    }


    /* PIN length */

    if(enteredPin.length !== 6){

        showMessage(
            "PIN must contain exactly 6 digits.",
            "error"
        );

        return;
    }


    /* Firebase generated PIN */

    const correctPin =
        String(candidateData.examPin || "").trim();


    if(!correctPin){

        showMessage(
            "Exam PIN has not been generated by the invigilator yet.",
            "error"
        );

        return;
    }


    /* PIN check */

    if(enteredPin !== correctPin){

        showMessage(
            "❌ Incorrect PIN. Please enter the PIN generated by the invigilator.",
            "error"
        );

        return;
    }


    /* Check expiry */

    if(candidateData.examPinExpiresAt){

        let expiryTime = null;

        try{

            if(
                candidateData.examPinExpiresAt.toDate
            ){

                expiryTime =
                    candidateData.examPinExpiresAt
                    .toDate()
                    .getTime();

            }else if(
                candidateData.examPinExpiresAt.seconds
            ){

                expiryTime =
                    candidateData.examPinExpiresAt.seconds * 1000;

            }

        }catch(e){

            console.log("Expiry check skipped",e);

        }


        if(
            expiryTime &&
            Date.now() > expiryTime
        ){

            showMessage(
                "❌ This examination PIN has expired. Ask the invigilator to generate a new PIN.",
                "error"
            );

            return;
        }

    }


    /* =========================
       SUCCESS
    ========================= */

    button.disabled = true;

    button.textContent =
        "PIN Verified ✓ Opening Instructions...";


    showMessage(
        "✅ PIN verified successfully. Opening instructions...",
        "success"
    );


    /* Session */

    sessionStorage.setItem(
        "examAccessGranted",
        "true"
    );

    sessionStorage.setItem(
        "examAccessTime",
        Date.now().toString()
    );

    sessionStorage.setItem(
        "candidateId",
        currentUser.uid
    );

    sessionStorage.setItem(
        "examId",
        candidateData.assignedExamId || ""
    );

    sessionStorage.setItem(
        "examName",
        candidateData.assignedExamName || ""
    );

    sessionStorage.setItem(
        "rollNumber",
        candidateData.rollNumber || ""
    );

    sessionStorage.setItem(
        "centre",
        candidateData.centre ||
        candidateData.center ||
        ""
    );

    sessionStorage.setItem(
        "roomNo",
        candidateData.roomNo ||
        candidateData.lab ||
        ""
    );

    sessionStorage.setItem(
        "seatNumber",
        candidateData.seatNumber || ""
    );


    /*
       IMPORTANT:
       Direct redirect to instructions.html
    */

    setTimeout(function(){

        window.location.replace(
            "instructions.html"
        );

    },1000);

});


/* =========================
   ENTER KEY SUPPORT
========================= */

document
.getElementById("examPin")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        document
        .getElementById("verifyButton")
        .click();

    }

});


/* =========================
   ONLY NUMBERS
========================= */

document
.getElementById("examPin")
.addEventListener("input", function(){

    this.value =
        this.value
        .replace(/[^0-9]/g,"")
        .slice(0,6);

});

</script>

</body>
</html>
