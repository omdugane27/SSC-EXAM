<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invigilator Login | SSC Examination System</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#064e3b,#059669);
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    width:75px;
    height:75px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#fff;
    color:#047857;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.heading{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.heading h1{
    font-size:23px;
    margin-bottom:6px;
}

.heading p{
    font-size:13px;
}

.card{
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.card h2{
    text-align:center;
    color:#065f46;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:13px;
    margin-bottom:24px;
}

.group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:bold;
    color:#334155;
}

input{
    width:100%;
    height:49px;
    padding:0 13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#059669;
    box-shadow:0 0 0 3px rgba(5,150,105,.12);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    font-size:18px;
    cursor:pointer;
}

.login-button{
    width:100%;
    height:49px;
    border:0;
    border-radius:9px;
    background:#059669;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login-button:hover{
    background:#047857;
}

.login-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    font-size:13px;
    line-height:1.5;
    text-align:center;
    word-break:break-word;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#059669;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

.back:hover{
    text-decoration:underline;
}

.security{
    text-align:center;
    margin-top:18px;
    color:#94a3b8;
    font-size:11px;
}

.debug{
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#f8fafc;
    color:#64748b;
    font-size:10px;
    line-height:1.5;
    display:none;
    word-break:break-word;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        SSC
    </div>

    <div class="heading">

        <h1>
            SSC Examination System
        </h1>

        <p>
            Secure Invigilator Portal
        </p>

    </div>


    <div class="card">

        <h2>
            Invigilator Login
        </h2>

        <p class="subtitle">
            Sign in using credentials provided by the administrator.
        </p>


        <div class="group">

            <label for="email">
                Invigilator Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
            >

        </div>


        <div class="group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="eye"
                    id="eyeButton"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>

        </div>


        <button
            type="button"
            id="loginButton"
            class="login-button"
        >
            Sign In
        </button>


        <div id="message"></div>


        <div
            id="debug"
            class="debug"
        ></div>


        <a
            href="index.html"
            class="back"
        >
            Back to Main Portal
        </a>


        <div class="security">
            Registration is controlled by the administrator
        </div>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCuYIuB_I9OrrTx6Qox6GnUerkN_vDgIHI",

    authDomain:
        "ssc-exam-project-8af6b.firebaseapp.com",

    projectId:
        "ssc-exam-project-8af6b",

    storageBucket:
        "ssc-exam-project-8af6b.firebasestorage.app",

    messagingSenderId:
        "288245274853",

    appId:
        "1:288245274853:web:b4d535a08faf305f5e9c0c",

    measurementId:
        "G-4BTLY67VDS"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

try{

    if(!firebase.apps.length){

        firebase.initializeApp(
            firebaseConfig
        );

    }

}
catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

}


/* =====================================================
   SERVICES
===================================================== */

const auth =
    firebase.auth();

const db =
    firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const eyeButton =
    document.getElementById(
        "eyeButton"
    );

const message =
    document.getElementById(
        "message"
    );

const debugBox =
    document.getElementById(
        "debug"
    );


let loginInProgress =
    false;


/* =====================================================
   FIREBASE PERSISTENCE
===================================================== */

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.catch(function(error){

    console.warn(
        "Persistence warning:",
        error
    );

});


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        type;

    message.style.display =
        "block";

}


/* =====================================================
   DEBUG
===================================================== */

function showDebug(text){

    if(!debugBox){
        return;
    }

    debugBox.textContent =
        text;

    debugBox.style.display =
        "block";

}


function hideDebug(){

    if(debugBox){

        debugBox.style.display =
            "none";

    }

}


/* =====================================================
   BUTTON RESET
===================================================== */

function resetButton(){

    loginInProgress =
        false;

    loginButton.disabled =
        false;

    loginButton.textContent =
        "Sign In";

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

eyeButton.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            eyeButton.textContent =
                "🙈";

        }
        else{

            passwordInput.type =
                "password";

            eyeButton.textContent =
                "👁️";

        }

    }
);


/* =====================================================
   FIREBASE ERROR MESSAGE
===================================================== */

function firebaseErrorMessage(
    error
){

    if(!error){
        return "Login failed.";
    }


    switch(error.code){

        case "auth/invalid-email":

            return "Invalid email address.";


        case "auth/user-disabled":

            return "This Firebase account has been disabled.";


        case "auth/user-not-found":

            return "No Firebase account exists with this email.";


        case "auth/wrong-password":

            return "Incorrect password.";


        case "auth/invalid-credential":

            return "Incorrect email or password.";


        case "auth/invalid-api-key":

        case "auth/api-key-not-valid":

            return "Firebase API key is invalid.";


        case "auth/network-request-failed":

            return "Network error. Check your internet connection.";


        case "auth/too-many-requests":

            return "Too many attempts. Please try again later.";


        case "auth/operation-not-allowed":

            return "Email/Password authentication is disabled in Firebase.";


        default:

            return (
                error.message ||
                "Login failed."
            );

    }

}


/* =====================================================
   GET PROFILE BY UID
===================================================== */

async function getProfileByUID(
    uid
){

    try{

        const snap =
            await db
            .collection(
                "invigilators"
            )
            .doc(uid)
            .get();


        if(
            snap.exists
        ){

            return {

                id:
                    snap.id,

                data:
                    snap.data() || {}

            };

        }

    }
    catch(error){

        console.warn(
            "UID profile lookup failed:",
            error
        );

    }


    return null;

}


/* =====================================================
   GET PROFILE BY EMAIL
===================================================== */

async function getProfileByEmail(
    email
){

    try{

        const result =
            await db
            .collection(
                "invigilators"
            )
            .where(
                "email",
                "==",
                email
            )
            .limit(1)
            .get();


        if(
            !result.empty
        ){

            const doc =
                result.docs[0];


            return {

                id:
                    doc.id,

                data:
                    doc.data() || {}

            };

        }

    }
    catch(error){

        console.warn(
            "Email profile lookup failed:",
            error
        );

    }


    return null;

}


/* =====================================================
   SAVE INVIGILATOR SESSION
===================================================== */

function saveSession(
    user,
    profile
){

    const data =
        profile.data || {};


    sessionStorage.setItem(
        "userRole",
        "invigilator"
    );


    sessionStorage.setItem(
        "invigilatorUid",
        user.uid
    );


    sessionStorage.setItem(
        "invigilatorEmail",
        user.email || ""
    );


    sessionStorage.setItem(
        "invigilatorDocId",
        profile.id || user.uid
    );


    sessionStorage.setItem(
        "invigilatorName",
        data.fullName ||
        data.name ||
        "Invigilator"
    );


    sessionStorage.setItem(
        "invigilatorId",
        data.employeeId ||
        data.invigilatorId ||
        ""
    );


    sessionStorage.setItem(
        "invigilatorCentre",
        data.centre ||
        data.center ||
        ""
    );


    sessionStorage.setItem(
        "invigilatorRoom",
        data.roomNo ||
        data.room ||
        data.lab ||
        ""
    );


    sessionStorage.setItem(
        "invigilatorLab",
        data.lab ||
        data.roomNo ||
        data.room ||
        ""
    );


    sessionStorage.setItem(
        "invigilatorLoginTime",
        String(
            Date.now()
        )
    );

}


/* =====================================================
   LOGIN
===================================================== */

async function invigilatorLogin(){

    if(loginInProgress){

        return;

    }


    hideDebug();


    const email =
        emailInput.value
        .trim()
        .toLowerCase();


    const password =
        passwordInput.value;


    if(!email){

        showMessage(
            "Please enter your email.",
            "error"
        );

        emailInput.focus();

        return;

    }


    if(!password){

        showMessage(
            "Please enter your password.",
            "error"
        );

        passwordInput.focus();

        return;

    }


    loginInProgress =
        true;


    loginButton.disabled =
        true;


    loginButton.textContent =
        "Signing In...";


    try{

        showMessage(
            "Connecting to Firebase...",
            "info"
        );


        /* =============================================
           FIREBASE AUTH
        ============================================= */

        const result =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        const user =
            result.user;


        console.log(
            "Firebase Auth UID:",
            user.uid
        );


        showMessage(
            "Authentication successful. Checking invigilator profile...",
            "info"
        );


        /* =============================================
           PROFILE BY UID
        ============================================= */

        let profile =
            await getProfileByUID(
                user.uid
            );


        /* =============================================
           PROFILE FALLBACK BY EMAIL
        ============================================= */

        if(!profile){

            profile =
                await getProfileByEmail(
                    email
                );

        }


        /* =============================================
           PROFILE NOT FOUND
        ============================================= */

        if(!profile){

            await auth.signOut();


            showMessage(
                "Firebase login is correct, but no invigilator profile was found in Firestore.",
                "error"
            );


            showDebug(
                "Auth UID: " +
                user.uid +
                "\n\n" +
                "Expected Firestore collection: invigilators\n\n" +
                "Expected document ID: " +
                user.uid +
                "\n\n" +
                "Email searched: " +
                email
            );


            resetButton();

            return;

        }


        const data =
            profile.data || {};


        console.log(
            "Invigilator profile:",
            data
        );


        /* =============================================
           ROLE CHECK
        ============================================= */

        const role =
            String(
                data.role ||
                "invigilator"
            )
            .trim()
            .toLowerCase();


        if(
            role !==
            "invigilator"
        ){

            await auth.signOut();


            showMessage(
                "This account is not registered as an invigilator.",
                "error"
            );


            resetButton();

            return;

        }


        /* =============================================
           STATUS CHECK
        ============================================= */

        const status =
            String(
                data.status ||
                "active"
            )
            .trim()
            .toLowerCase();


        if(
            status === "inactive" ||
            status === "disabled" ||
            status === "blocked"
        ){

            await auth.signOut();


            showMessage(
                "Your invigilator account is inactive. Contact the administrator.",
                "error"
            );


            resetButton();

            return;

        }


        /* =============================================
           SAVE SESSION
        ============================================= */

        saveSession(
            user,
            profile
        );


        /* =============================================
           SUCCESS
        ============================================= */

        showMessage(
            "✅ Login successful. Opening dashboard...",
            "success"
        );


        loginButton.textContent =
            "Opening Dashboard...";


        /*
         * Use replace so browser back button
         * does not return to login unnecessarily.
         */

        setTimeout(
            function(){

                window.location.replace(
                    "invigilator_dashboard.html"
                );

            },
            500
        );


    }
    catch(error){

        console.error(
            "INVIGILATOR LOGIN ERROR:",
            error
        );


        showMessage(
            "❌ " +
            firebaseErrorMessage(
                error
            ),
            "error"
        );


        showDebug(
            "Error Code: " +
            (error.code || "unknown") +
            "\n\n" +
            "Error Message: " +
            (error.message || "unknown")
        );


        /*
         * If authentication succeeded but
         * Firestore caused an error, ensure
         * no broken session remains.
         */

        try{

            if(
                auth.currentUser
            ){

                await auth.signOut();

            }

        }
        catch(signOutError){

            console.warn(
                signOutError
            );

        }


        resetButton();

    }

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

loginButton.addEventListener(
    "click",
    function(){

        invigilatorLogin();

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

emailInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            invigilatorLogin();

        }

    }
);


/* =====================================================
   INITIAL AUTH CHECK
===================================================== */

auth.onAuthStateChanged(
    function(user){

        if(!user){

            return;

        }


        /*
         * If already logged in and session
         * belongs to invigilator, don't
         * automatically redirect immediately.
         *
         * User can press Sign In normally.
         */

        console.log(
            "Existing Firebase session:",
            user.uid
        );

    }
);

</script>

</body>
</html>
