<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SSC Computer Based Examination</title>

<link rel="stylesheet" href="style.css">

<style>

.exam-page{
    min-height:100vh;
    background:linear-gradient(135deg,#0f1f4d,#243f91);
    color:white;
}

.exam-header{
    min-height:70px;
    background:#101b3d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 25px;
    gap:20px;
}

.exam-header b{
    font-size:20px;
}

#candidateName{
    font-size:16px;
}

.timer{
    background:#dc2626;
    padding:10px 18px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

.exam-container{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:20px;
    padding:25px;
    max-width:1400px;
    margin:auto;
}

.question-section{
    background:white;
    color:#111827;
    border-radius:15px;
    padding:25px;
    min-height:500px;
}

.question-number{
    font-size:18px;
    font-weight:bold;
    color:#1e3a8a;
    margin-bottom:20px;
}

.question-text{
    font-size:20px;
    line-height:1.7;
    font-weight:600;
    margin-bottom:25px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.exam-option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:16px;
    border:2px solid #dbe3ef;
    border-radius:12px;
    cursor:pointer;
    background:#f8fafc;
    color:#111827;
    font-size:17px;
    line-height:1.5;
}

.exam-option:hover{
    border-color:#2563eb;
    background:#eff6ff;
}

.exam-option input{
    width:20px;
    height:20px;
    margin-top:3px;
}

.exam-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:30px;
}

.exam-buttons button{
    border:none;
    padding:13px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.exam-buttons button:first-child{
    background:#38bdf8;
    color:#082f49;
}

.exam-buttons button:nth-child(2){
    background:#e5e7eb;
    color:#111827;
}

.exam-buttons button:nth-child(3){
    background:#a855f7;
    color:white;
}

.exam-buttons button:nth-child(4){
    background:#2563eb;
    color:white;
}

.exam-buttons button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.palette{
    background:white;
    color:#111827;
    border-radius:15px;
    padding:20px;
    height:max-content;
}

.palette h3{
    margin-bottom:15px;
}

.palette-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-bottom:20px;
}

.palette-question{
    height:42px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background:#e5e7eb;
    cursor:pointer;
    font-weight:bold;
}

.palette-question.answered{
    background:#84cc16;
    color:white;
}

.palette-question.marked{
    background:#a855f7;
    color:white;
}

.palette-question.current{
    outline:3px solid #2563eb;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.loading{
    text-align:center;
    padding:50px;
    font-size:20px;
}

@media(max-width:800px){

    .exam-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .exam-container{
        grid-template-columns:1fr;
        padding:12px;
    }

    .question-section{
        padding:18px;
    }

    .question-text{
        font-size:18px;
    }

    .exam-buttons{
        flex-direction:column;
    }

    .exam-buttons button{
        width:100%;
    }

}

</style>

</head>


<body>

<div class="exam-page">


<header class="exam-header">

    <b>
        SSC COMPUTER BASED EXAMINATION
    </b>

    <span id="candidateName">
        Candidate
    </span>

    <div class="timer">
        <span id="timer">
            60:00
        </span>
    </div>

</header>


<main class="exam-container">


<section class="question-section">

    <div class="question-number">

        Question
        <span id="questionNumber">1</span>

        of
        <span id="totalQuestions">0</span>

    </div>


    <div id="questionText"
         class="question-text">

        Loading question...

    </div>


    <div id="options"
         class="options">

        <div class="loading">
            Loading options...
        </div>

    </div>


    <div class="exam-buttons">

        <button
            onclick="previousQuestion()">
            Previous
        </button>


        <button
            onclick="clearAnswer()">
            Clear Response
        </button>


        <button
            onclick="markReview()">
            Mark for Review
        </button>


        <button
            onclick="nextQuestion()">
            Save & Next
        </button>

    </div>

</section>



<aside class="palette">

    <h3>
        Question Palette
    </h3>


    <div id="questionPalette"
         class="palette-grid">
    </div>


    <button
        onclick="submitExam()"
        class="submit-btn">

        Submit Examination

    </button>

</aside>


</main>

</div>


<!-- =====================================================
     FIREBASE SDK
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>


<!-- =====================================================
     EXAM SCRIPT
===================================================== -->

<script src="script.js"></script>


<script>

/*
   Update total question count
   after script loads questions.
*/

const originalDisplayQuestion =
    window.displayQuestion;

if(typeof originalDisplayQuestion === "function"){

    window.displayQuestion = function(){

        originalDisplayQuestion();

        const total =
            document.getElementById(
                "totalQuestions"
            );

        if(total && window.questions){

            total.textContent =
                window.questions.length;

        }

    };

}

</script>


</body>

</html>
